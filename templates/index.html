<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>AI 绘本生成器</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        .step { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        h2 { color: #333; }
        textarea, select, input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; }
        button.secondary { background: #2196F3; }
        button.secondary:hover { background: #1976D2; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .result { margin-top: 10px; }
        .error { color: red; }
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .image-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; }
        .image-card img { max-width: 100%; border-radius: 4px; }
        .image-card .page-num { font-weight: bold; margin-top: 5px; }
        .file-info { padding: 10px; background: #e8f5e9; border-radius: 4px; margin: 10px 0; }
        .file-row { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>
    <h1>🎨 AI 绘本生成器</h1>

    <div class="step">
        <h2>第一步：输入或上传故事内容</h2>
        <div class="file-row">
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" />
            <button class="secondary" onclick="uploadFile()">📤 上传并解析</button>
        </div>
        <div id="fileInfo" class="file-info" style="display:none;"></div>
        <textarea id="storyContent" rows="8" placeholder="输入故事内容，或上传文件自动解析..."></textarea>
        <label>生成页数：</label>
        <select id="numPages">
            <option value="5">5页</option>
            <option value="8" selected>8页</option>
            <option value="10">10页</option>
            <option value="12">12页</option>
        </select>
        <button onclick="generateOutline()">✨ 生成绘本大纲</button>
        <div id="outlineResult" class="result"></div>
    </div>

    <div class="step">
        <h2>第二步：生成图片</h2>
        <button id="generateImagesBtn" onclick="generateImages()" disabled>🎨 生成所有图片</button>
        <div id="imagesResult" class="result"></div>
    </div>

    <div class="step">
        <h2>第三步：导出 PDF</h2>
        <button id="exportPdfBtn" onclick="exportPdf()" disabled>📚 导出绘本 PDF</button>
        <div id="exportResult" class="result"></div>
    </div>

    <script>
        let currentOutline = null;
        let currentImages = null;
        let currentTaskId = null;
        let currentFilepath = null;

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const storyContent = document.getElementById('storyContent');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('请选择文件');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            fileInfo.style.display = 'block';
            fileInfo.innerHTML = '上传中...';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    fileInfo.innerHTML = `<span class="error">上传失败: ${data.error}</span>`;
                    return;
                }

                currentFilepath = data.filepath;
                fileInfo.innerHTML = `文件已上传: ${file.name}<br>正在解析内容...`;

                const parseResponse = await fetch('/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filepath: currentFilepath })
                });
                const parseData = await parseResponse.json();

                if (parseData.error) {
                    fileInfo.innerHTML = `<span class="error">解析失败: ${parseData.error}</span>`;
                    return;
                }

                storyContent.value = parseData.content;
                fileInfo.innerHTML = `✅ 文件解析完成: ${file.name}<br>字数: ${parseData.content.length} 字`;

            } catch (err) {
                fileInfo.innerHTML = `<span class="error">错误: ${err.message}</span>`;
            }
        }

        async function generateOutline() {
            const content = document.getElementById('storyContent').value;
            const numPages = document.getElementById('numPages').value;
            const resultDiv = document.getElementById('outlineResult');

            if (!content.trim()) {
                alert('请输入故事内容或上传文件');
                return;
            }

            resultDiv.innerHTML = '正在生成大纲（可能需要几秒钟）...';

            try {
                const response = await fetch('/api/outline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, num_pages: parseInt(numPages) })
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="error">错误: ${data.error}</p>`;
                    return;
                }

                currentOutline = data.outline;
                currentTaskId = Date.now().toString();

                resultDiv.innerHTML = `
                    <h3>📖 封面</h3>
                    <pre>标题: ${currentOutline.cover.title}
副标题: ${currentOutline.cover.subtitle}
视觉关键词: ${currentOutline.cover.visual_keywords.join(', ')}</pre>

                    <h3>📄 内容页 (${currentOutline.pages.length}页)</h3>
                    ${currentOutline.pages.map(p => `
                        <div style="margin: 10px 0; padding: 10px; background: #f9f9f9;">
                            <strong>第${p.page_num}页</strong><br>
                            叙事目标: ${p.narrative_goal}<br>
                            内容: ${p.content}<br>
                            视觉: ${p.visual}<br>
                            布局: ${p.layout}
                        </div>
                    `).join('')}

                    <h3>📋 封底</h3>
                    <pre>情绪落点: ${currentOutline.back_cover.emotion}
最后一句话: ${currentOutline.back_cover.final_line}</pre>
                `;

                document.getElementById('generateImagesBtn').disabled = false;
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">错误: ${err.message}</p>`;
            }
        }

        async function generateImages() {
            const resultDiv = document.getElementById('imagesResult');
            const btn = document.getElementById('generateImagesBtn');
            btn.disabled = true;
            btn.textContent = '生成中...';
            resultDiv.innerHTML = '正在生成图片（这可能需要几分钟）...';

            try {
                const response = await fetch('/api/images', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ outline: currentOutline })
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="error">错误: ${data.error}</p>`;
                    btn.disabled = false;
                    btn.textContent = '🎨 生成所有图片';
                    return;
                }

                currentImages = data.images;

                if (!currentImages || currentImages.length === 0) {
                    resultDiv.innerHTML = '<p>没有生成任何图片</p>';
                    return;
                }

                const successCount = currentImages.filter(img => img.image_url && !img.image_url.startsWith('http')).length;
                resultDiv.innerHTML = `
                    <p>✅ 图片生成完成！成功 ${successCount}/${currentImages.length} 张</p>
                    <div class="images-grid">
                        ${currentImages.map((img, i) => `
                            <div class="image-card">
                                ${img.error
                                    ? `<p class="error">❌ ${img.error}</p>`
                                    : `<img src="${img.image_url}" alt="第${i+1}页" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2214%22>加载失败</text></svg>'" />`
                                }
                                <div class="page-num">第${i+1}页</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                document.getElementById('exportPdfBtn').disabled = false;
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">错误: ${err.message}</p>`;
                btn.disabled = false;
                btn.textContent = '🎨 生成所有图片';
            }

            btn.textContent = '🎨 生成所有图片';
        }

        async function exportPdf() {
            const resultDiv = document.getElementById('exportResult');
            const btn = document.getElementById('exportPdfBtn');
            btn.disabled = true;
            btn.textContent = '导出中...';
            resultDiv.innerHTML = '正在导出 PDF...';

            try {
                const response = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        outline: currentOutline,
                        images: currentImages,
                        task_id: currentTaskId
                    })
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="error">错误: ${data.error}</p>`;
                    btn.disabled = false;
                    btn.textContent = '📚 导出绘本 PDF';
                    return;
                }

                resultDiv.innerHTML = `
                    <p>✅ PDF 导出完成！</p>
                    <p><a href="${data.download_url}" target="_blank">📥 点击下载绘本 PDF</a></p>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">错误: ${err.message}</p>`;
                btn.disabled = false;
                btn.textContent = '📚 导出绘本 PDF';
            }

            btn.textContent = '📚 导出绘本 PDF';
        }
    </script>
</body>
</html>
